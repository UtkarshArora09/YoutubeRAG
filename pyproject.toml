[project]
name = "youtube-rag"
version = "0.1.0"
description = "RAG pipeline over YouTube videos/playlists with pgvector, LangChain, LangGraph, and Groq"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pgvector==0.3.4",
    "langchain==0.3.4",
    "langchain-groq==0.2.0",
    "langchain-community==0.3.2",
    "langgraph==0.2.34",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2025.1.1",
    "python-dotenv==1.0.1",
    "pydantic-settings==2.5.2",
    "sentence-transformers==3.2.1",
    "torch==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
